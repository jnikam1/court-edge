name: Deploy logger
# Puts worker/ on Cloudflare. Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-logger.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find the D1 database
        working-directory: worker
        run: |
          npx --yes wrangler@4 d1 list --json > /tmp/d1.json
          ID=$(node -e "const l=JSON.parse(require('fs').readFileSync('/tmp/d1.json','utf8')); const d=l.find(x=>x.name==='court-edge')||(l.length===1?l[0]:null); if(!d){console.error('No D1 database named court-edge. Found: '+l.map(x=>x.name).join(', '));process.exit(1)} process.stdout.write(d.uuid||d.database_id||d.id)")
          sed -i "s/__D1_ID__/$ID/; s/database_name = \"court-edge\"/database_name = \"$(node -e "const l=JSON.parse(require('fs').readFileSync('/tmp/d1.json','utf8')); const d=l.find(x=>x.name==='court-edge')||l[0]; process.stdout.write(d.name)")\"/" wrangler.toml
      - name: Deploy
        working-directory: worker
        run: npx --yes wrangler@4 deploy
